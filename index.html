<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niño & Steph Wedding Invitation</title>
    <!-- Google Fonts for Elegant Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <style>
        /* Color Palette Mapping */
        :root {
            --sage-green: #8F9E8B;
            --dusty-blue: #A2B7C4;
            --pastel-yellow: #FBE6A2;
            --dusty-rose: #E6AFAF;
            --blush-pink: #F3D1D1;
            --dark-text: #4A4A4A;
            --bg-cream: #FAFAFA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--dark-text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Ambient Floating Animation Canvas */
        #animation-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* Background Music Control Interface */
        .audio-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            border: 1px solid var(--sage-green);
        }

        .music-btn {
            background: var(--sage-green);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.05);
        }

        .music-info {
            font-size: 11px;
            font-weight: 500;
            color: var(--dark-text);
        }

        /* Scroll Animation States */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Sections Shared Rules */
        section {
            padding: 80px 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .script-text {
            font-family: 'Pinyon Script', cursive;
            font-size: 3.5rem;
            color: var(--sage-green);
            line-height: 1;
            margin: 10px 0;
        }

        /* Hero Splash Banner */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.85)), url('https://images.unsplash.com/photo-1545232979-8bf34eb9757b?q=80&w=1600') center/cover no-repeat;
            position: relative;
            padding: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .hero-date {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 20px;
            border-top: 1px solid var(--dark-text);
            border-bottom: 1px solid var(--dark-text);
            padding: 8px 20px;
        }

        /* Live Visual Countdown Timer */
        .countdown-container {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .time-block {
            background: white;
            padding: 15px;
            border-radius: 8px;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-bottom: 3px solid var(--dusty-blue);
        }

        .time-num {
            font-size: 1.8rem;
            font-weight: 600;
            display: block;
            color: var(--dark-text);
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        /* Layout Columns Construction */
        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 30px;
            text-align: center;
        }

        .column-left {
            border-right: 1px solid #E5E5E5;
            padding-right: 20px;
        }

        .column-right {
            padding-left: 20px;
        }

        .entourage-section p {
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .section-title-decoration h2 {
            font-size: 1.8rem;
            display: inline-block;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title-decoration h2::after {
            content: '';
            width: 50px;
            height: 1px;
            background: var(--sage-green);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Dress Code & Interactive Color Motif */
        .palette-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .color-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .color-circle:hover {
            transform: scale(1.15);
        }

        /* Form Controls Setup */
        .rsvp-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 550px;
            margin: 30px auto 0;
            border: 1px solid #F0F0F0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #DDD;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--sage-green);
        }

        .submit-btn {
            background: var(--sage-green);
            color: white;
            border: none;
            padding: 14px 40px;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #7A8977;
        }

        .policy-note {
            background: #FDF7F7;
            border-left: 3px solid var(--dusty-rose);
            padding: 15px;
            font-size: 0.85rem;
            margin-top: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        /* Embedded Interactive Map Interface */
        .map-wrapper {
            margin-top: 30px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #EAEAEA;
        }

        /* Comprehensive Responsive Rules */
        @media (max-width: 768px) {
            .split-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            .column-left {
                border-right: none;
                border-bottom: 1px solid #E5E5E5;
                padding-right: 0;
                padding-bottom: 25px;
            }
            .column-right {
                padding-left: 0;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .script-text {
                font-size: 2.8rem;
            }
            section {
                padding: 60px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Animation Layer -->
    <canvas id="animation-canvas"></canvas>

    <!-- Background Acoustic Audio Framework Container -->
    <div class="audio-player">
        <button class="music-btn" id="play-pause-btn" onclick="toggleAudio()">▶</button>
        <div class="music-info">
            <strong>I Love You Always Forever</strong><br>
            <span style="color:#777;">Donna Lewis (Acoustic)</span>
        </div>
        <audio id="bg-audio" loop>
            <source src="I_Love_You_Always_Forever_Acoustic.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1 style="font-weight: 300;">THE WEDDING CELEBRATION OF</h1>
        <div class="script-text">Niño & Steph</div>
